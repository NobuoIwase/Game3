# 新キャラ・新フラグメントのワンボタン取り込み。
# アプリの「データ」タブのボタン → このワークフローの「Run workflow」で実行する。
# 公開済みの game_data/*.json をクロールキャッシュとしてシードするため、
# 参照サイトからは新規ページだけを取得する（既存 700 ページ超の再取得はしない）。
# 変更があればテストを通してから main にコミットし、gh-pages へミラーして公開する。
name: Update game data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 新キャラ・新フラグを差分取得
        run: node tools/crawl_dblegends.mjs --update
      - name: テスト
        run: npm test
      - name: 変更があれば main にコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_data
          # meta.json は生成時刻で毎回変わるため、それ以外に変化があるときだけコミットする
          if ! git diff --cached --name-only | grep -qv '^game_data/meta.json$'; then
            echo "新しいデータはありませんでした"
            git reset -q
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ゲームデータを更新（新キャラ・新フラグメントの取り込み）"
            git push origin HEAD:main
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Pages へ配信（gh-pages を更新）
        if: steps.commit.outputs.changed == '1'
        run: git push origin HEAD:gh-pages --force
