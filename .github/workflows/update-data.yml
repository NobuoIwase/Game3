# 新キャラ・新フラグメントのワンボタン取り込み。
# アプリの「データ」タブのボタン → このワークフローの「Run workflow」で実行する。
# 公開済みの game_data/*.json をクロールキャッシュとしてシードするため、
# 参照サイトからは新規ページだけを取得する（既存 700 ページ超の再取得はしない）。
# 変更があればテストを通してから main にコミットし、gh-pages へミラーして公開する。
name: Update game data

on:
  workflow_dispatch: # 管理者の手動実行用（アプリからは使わない）
  schedule:
    # 毎日 14:30 / 15:10 / 18:00 JST (05:30 / 06:10 / 09:00 UTC) に自動で差分取得する。
    # --update は一覧2ページ＋新規ページのみの取得なので参照サイトへの負荷は僅少。
    # GitHub の cron は負荷状況で数分〜1時間程度遅れることがある
    - cron: '30 5 * * *'
    - cron: '10 6 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 新キャラ・新フラグを差分取得
        run: node tools/crawl_dblegends.mjs --update
      - name: テスト
        run: npm test
      - name: コミットして配信
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          # meta.json 以外に変化があれば実データの更新。meta.json だけなら
          # 「確認したが新規なし」の記録（checked_at）を公開する — §28
          if git diff --cached --name-only | grep -qv '^game_data/meta.json$'; then
            git commit -m "ゲームデータを更新（新キャラ・新フラグメントの取り込み）"
          else
            git commit -m "データ確認（新規なし）"
          fi
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
