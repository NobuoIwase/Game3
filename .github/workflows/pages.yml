# GitHub Pages への配信（DESIGN.md §7）
# Pages のソースは gh-pages ブランチ（branch 配信）。main に push すると
# テスト実行後に main の内容をそのまま gh-pages へミラーして公開する。
# （Actions 標準トークンでは Pages サイトの新規作成ができないため、
#   artifact 方式ではなく branch 方式を採用している）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game3-publication
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mhn/ の読み込みURLにバージョンを付ける（ブラウザ・CDNの古いキャッシュ対策）
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__V__/${V}/g" mhn/index.html mhn/js/*.js
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "deploy: mhn version ${V}" || true
      - name: main の内容を gh-pages へミラー
        run: node tools/publish-pages.mjs
