# GitHub Pages への配信（DESIGN.md §7）
# Pages のソースは gh-pages ブランチ（branch 配信）。main に push すると
# テスト実行後に main の内容をそのまま gh-pages へミラーして公開する。
# （Actions 標準トークンでは Pages サイトの新規作成ができないため、
#   artifact 方式ではなく branch 方式を採用している）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: main の内容を gh-pages へミラー
        run: git push origin HEAD:gh-pages --force
