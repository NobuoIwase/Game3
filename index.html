<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="フラグ最適化">
  <title>DBL フラグメント最適化</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>DBL フラグメント最適化</h1>
    <p class="sub">個人利用・ローカル保存</p>
  </header>

  <div id="banner"></div>

  <main>
    <section id="tab-calc" class="tab" hidden>
      <h2>計算（検証用）</h2>
      <p class="hint">1キャラ分の ❶〜❻ を計算します。実機のステータス画面と一致することを確認してください。</p>
      <div id="calc-form"></div>
      <div id="calc-result"></div>
    </section>

    <section id="tab-optimize" class="tab" hidden>
      <h2>最適化</h2>
      <p class="hint">パーティを選ぶと、所持フラグメントの最適な配分を計算します。</p>
      <div id="optimize-form"></div>
      <div id="optimize-result"></div>
    </section>

    <section id="tab-chars" class="tab" hidden>
      <h2>キャラクター</h2>
      <div id="chars-view"></div>
    </section>

    <section id="tab-frags" class="tab" hidden>
      <h2>フラグメント</h2>
      <div id="frags-view"></div>
    </section>

    <section id="tab-data" class="tab" hidden>
      <h2>データ管理</h2>
      <div id="data-view"></div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-tab="calc">計算</button>
    <button data-tab="optimize">最適化</button>
    <button data-tab="chars">キャラ</button>
    <button data-tab="frags">フラグ</button>
    <button data-tab="data">データ</button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
